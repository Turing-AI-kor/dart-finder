name: DART Finder

on:
  workflow_dispatch:
    inputs:
      opendart_api_key:
        description: 'OpenDART API Key 40자리'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: dart-finder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validate repository layout
        run: |
          test -f requirements.txt || { echo 'requirements.txt 없음. repo root에 올려야 함'; exit 1; }
          test -f src/main.py || { echo 'src/main.py 없음. repo root에 src 폴더가 있어야 함'; exit 1; }
          test -f src/scoring.py || { echo 'src/scoring.py 없음'; exit 1; }
          test -f .github/workflows/find.yml || { echo '.github/workflows/find.yml 없음'; exit 1; }

      - name: Prepare OpenDART key
        env:
          OPENDART_API_KEY_INPUT: ${{ github.event.inputs.opendart_api_key }}
        run: |
          echo "::add-mask::$OPENDART_API_KEY_INPUT"

          if [ -z "$OPENDART_API_KEY_INPUT" ]; then
            echo 'OpenDART API Key가 입력되지 않았습니다.'
            exit 1
          fi

          if [ "${#OPENDART_API_KEY_INPUT}" -ne 40 ]; then
            echo "OpenDART API Key 길이가 이상합니다: ${#OPENDART_API_KEY_INPUT}"
            exit 1
          fi

          echo "OPENDART_API_KEY=$OPENDART_API_KEY_INPUT" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore checkpoint cache
        uses: actions/cache@v4
        with:
          path: checkpoint
          key: dart-checkpoint-fixed5000-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            dart-checkpoint-fixed5000-${{ github.ref_name }}-
            dart-checkpoint-fixed5000-
            dart-checkpoint-

      - name: Smoke test CLI
        run: |
          python -m src.main --help
          python -m src.main check-key

      - name: DART target finding fixed 5000
        run: |
          python -m src.main find \
            --revenue-min 10000000000 \
            --revenue-max 500000000000 \
            --employees-min 30 \
            --employees-max 800 \
            --top 5000 \
            --sample-size 5000 \
            --include-unlisted \
            --min-score 25 \
            --concurrency 10

      - name: List outputs
        if: always()
        run: |
          echo 'output:'
          find output -maxdepth 2 -type f -print -exec ls -lh {} \; 2>/dev/null || true
          echo 'checkpoint:'
          find checkpoint -maxdepth 2 -type f -print -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targets-5000-${{ github.run_number }}
          path: |
            output/*.csv
            checkpoint/*.json
          if-no-files-found: warn
          retention-days: 90
